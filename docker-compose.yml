services:
  mysql:
    image: mysql:8.4
    container_name: easy-cash-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-easy_cash}
      MYSQL_USER: ${MYSQL_USER:-easy_cash}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-easy_cash_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-easy_cash_root_dev}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Easy Cash - برنامج المحاسبة}
    container_name: easy-cash-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8099}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-easy_cash}
      MYSQL_USER: ${MYSQL_USER:-easy_cash}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-easy_cash_dev}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-https://cash.easytecheg.net}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOW_WEAK_SECRETS: ${ALLOW_WEAK_SECRETS:-0}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Easy Cash - برنامج المحاسبة}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ix-ollama-ollama-1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      OLLAMA_MODEL_HEAVY: ${OLLAMA_MODEL_HEAVY:-qwen3:14b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-1}
      SHOPE_INTEGRATION_SECRET: ${SHOPE_INTEGRATION_SECRET}
      SHOPE_API_URL: ${SHOPE_API_URL:-http://host.docker.internal:8098}
      PAYMOB_REQUIRE_HMAC: ${PAYMOB_REQUIRE_HMAC:-1}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    networks:
      - default
      - ollama
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.text()).then(t=>process.exit(t.includes('easy-cash-erp')?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql-data:

networks:
  ollama:
    external: true
    name: ${OLLAMA_DOCKER_NETWORK:-ix-ollama_default}
